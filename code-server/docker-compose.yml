version: '3.8'

services:
  vscode-ide:
    build:
      context: .
      dockerfile: Dockerfile.bookworm-slim
      args:
        - UID=1000
        - GID=1000
    ports:
      - "3000:3000"
    volumes:
      # Mount workspace to persist work
      - ./code:/vscode/workspace:rw
      - ./vscode:/vscode/.vscode:rw
      # Optional: mount additional plugins
      - ./plugins:/vscode/plugins:rw
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    container_name: vscode-ide
